# Fleet operations: inventory + feedback harvest, and continuous benchmarks.
# Schedules ship PAUSED for the demo; unpause in a real deployment.
resources:
  jobs:
    harvest_feedback:
      name: genie-ops-harvest-feedback
      description: Snapshot every Genie agent and harvest questions + ratings from managed agents.
      schedule:
        quartz_cron_expression: "0 0 * * * ?"   # hourly
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: harvest
          spark_python_task:
            python_file: ../../scripts/harvest.py
            parameters: ["--ops", "${var.ops_catalog}.${var.ops_schema}", "--warehouse-id", "${var.warehouse_id}"]
          environment_key: ops
      environments:
        - environment_key: ops
          spec:
            environment_version: "4"
            dependencies: ["databricks-sdk==0.108.0"]

    fleet_benchmarks:
      name: genie-ops-fleet-benchmarks
      description: Run benchmarks for every managed prod agent and store results centrally (Beta eval API).
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # nightly 06:00 UTC
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - {name: trigger, default: nightly}
        - {name: tables, default: ""}
      tasks:
        - task_key: benchmarks
          spark_python_task:
            python_file: ../../scripts/fleet_benchmarks.py
            parameters: ["--ops", "${var.ops_catalog}.${var.ops_schema}", "--warehouse-id", "${var.warehouse_id}",
                         "--target", "prod", "--trigger", "{{job.parameters.trigger}}",
                         "--tables", "{{job.parameters.tables}}"]
          environment_key: ops
      environments:
        - environment_key: ops
          spec:
            environment_version: "4"
            dependencies: ["databricks-sdk==0.108.0"]

    benchmarks_on_upstream_change:
      name: genie-ops-benchmarks-on-upstream-change
      description: When a source table changes, re-benchmark only the agents that read it.
      trigger:
        pause_status: ${var.upstream_trigger_pause}
        table_update:
          table_names:
            - ${var.upstream_tables}
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: rebenchmark
          run_job_task:
            job_id: ${resources.jobs.fleet_benchmarks.id}
            job_parameters:
              trigger: upstream_change
              tables: ${var.upstream_tables}
